<head>
  <link rel="stylesheet" href="styles.css">
</head>
<body>


  <div id="header">
    <div>Ссылки:</div>
    <a href="https://github.com/gl4ssh0use/FOXWORLD">GitHub</a>
    <a href="https://raw.githubusercontent.com/gl4ssh0use/FOXWORLD/7420e1eb919ae281d5db7da30fc02fc0d4f9ce8f/LICENSE">LICENSE</a>
  </div>

  <div id = "chapters_block">
    <div id = "chapters_picker">
    </div>
    <div id = "chapters_picker_activator" onClick="useChaptersPicker()">
      <b>Главы</b>
    </div>
  </div>

  <div align="center" id = "content">
  </div>


  <script>
    const chapters_picker = document.getElementById("chapters_picker")

    const CHAPTERS_STORE = "./stores/chapters.txt";
    const CHAPTERS_FOLDER = "./chapters/";

    loadChapter("0_foreword.html");

    fetch(CHAPTERS_STORE)
      .then(res => res.text())
      .then(text => {
        const chapters = text.split("\n");
        for (const chapter of chapters) {
          if (chapter) {
            chapter_element = document.createElement("div");
            chapter_element.textContent = chapter.replace(".html", "");
            chapter_element.addEventListener("click", () => loadChapter(chapter));
            chapter_element.className = "chapter_element";
            chapters_picker.appendChild(chapter_element);
          }
        }
      })

    function useChaptersPicker() {
      const chapters_picker = document.getElementById("chapters_picker");
      const is_hidden = window.getComputedStyle(chapters_picker).display;

      chapters_picker.style.display = is_hidden === "none" ? "flex" : "none";
    }

    function loadChapter(page) {
      fetch(CHAPTERS_FOLDER + page)
        .then(response => response.text())
        .then(html => {
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');
          document.getElementById("content").innerHTML = doc.getElementById("content").innerHTML + "<br>" + "<br>";
        });
    }

  </script>

</body>
